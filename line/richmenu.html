<style>
  :root {
    --cream: #f8f3ec;
    --warm-white: #faf7f2;
    --sand: #e8dcc8;
    --taupe: #c8b49a;
    --clay: #a07858;
    --earth: #7a5c40;
    --bark: #4a3020;
    --sage: #8a9e7a;
    --text-mid: #6a4e35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body {
    background: var(--cream);
    font-family: 'Noto Sans JP', 'IPAPGothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .menu {
    width: 2500px;
    height: 1686px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 4px;
    background: var(--sand);
  }

  .cell {
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    position: relative;
  }

  /* 主導線（予約）のみ塗りで強調する */
  .cell.primary { background: var(--clay); }

  .icon { width: 150px; height: 150px; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .icon svg * { stroke: var(--clay); }
  .primary .icon svg * { stroke: var(--cream); }
  /* Xのロゴのみ塗りつぶし形状 */
  .icon.solid svg * { stroke: none; fill: var(--clay); }

  .label {
    font-family: 'Noto Serif JP', 'IPAPGothic', serif;
    font-weight: 600;
    font-size: 82px;
    letter-spacing: 0.08em;
    color: var(--bark);
    line-height: 1.2;
    text-align: center;
  }
  .primary .label { color: var(--warm-white); }

  .sub {
    font-family: 'Cormorant Garamond', 'Liberation Serif', serif;
    font-size: 40px;
    font-style: italic;
    letter-spacing: 0.28em;
    color: var(--taupe);
    text-transform: uppercase;
  }
  .primary .sub { color: var(--sand); }

  /* ラテン文字のみのラベルは字幅が広いので少し詰める */
  .label-latin { font-size: 72px; letter-spacing: 0.02em; }

  .note {
    font-size: 32px;
    letter-spacing: 0.1em;
    color: var(--text-mid);
    text-align: center;
    line-height: 1.5;
    /* 6マスすべてで4行構成にし、セル間の縦位置を揃えるための最低高 */
    min-height: 48px;
  }
  .primary .note { color: var(--sand); }

  /* 予約セルの「24時間受付」バッジ */
  .badge {
    display: inline-block;
    border: 2px solid var(--sand);
    border-radius: 999px;
    padding: 12px 32px;
    font-size: 32px;
    letter-spacing: 0.14em;
    color: var(--sand);
  }
</style>
</head>
<body>
<div class="menu">

  <!-- 1: ご予約（TOL） -->
  <div class="cell primary">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="10" width="36" height="32" rx="3"/>
        <path d="M6 20h36M16 6v8M32 6v8"/>
        <path d="M17 30l5 5 10-10"/>
      </svg>
    </div>
    <div class="label">ご予約</div>
    <div class="sub">Reserve</div>
    <div class="badge">24時間受付</div>
  </div>

  <!-- 2: メニュー・料金 -->
  <div class="cell">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 42c0-12 7-20 17-22-1 12-7 19-17 22z"/>
        <path d="M24 42C24 30 17 22 7 20c1 12 7 19 17 22z"/>
        <path d="M24 42V26"/>
      </svg>
    </div>
    <div class="label">メニュー・料金</div>
    <div class="sub">Menu</div>
    <div class="note">&nbsp;</div>
  </div>

  <!-- 3: X（旧Twitter） -->
  <div class="cell">
    <div class="icon solid">
      <svg viewBox="0 0 24 24">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </div>
    <div class="label">X</div>
    <div class="sub">Twitter</div>
    <div class="note">空き枠のお知らせ</div>
  </div>

  <!-- 4: アクセス -->
  <div class="cell">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 43s14-13.5 14-24a14 14 0 10-28 0c0 10.5 14 24 14 24z"/>
        <circle cx="24" cy="19" r="5.5"/>
      </svg>
    </div>
    <div class="label">アクセス</div>
    <div class="sub">Access</div>
    <div class="note">北千住駅 東口 徒歩3分</div>
  </div>

  <!-- 5: お電話 -->
  <div class="cell">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 7l6 9-5 4c2 5 5 8 10 10l4-5 9 6-4 6c-1.5 2-4 2-6.5 1C20 34 14 26 9.5 15.5 8.5 13 8.5 10.5 11 9z"/>
      </svg>
    </div>
    <div class="label">お電話</div>
    <div class="sub">Tel</div>
    <div class="note">080-5523-9301</div>
  </div>

  <!-- 6: Instagram -->
  <div class="cell">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="8" width="32" height="32" rx="9"/>
        <circle cx="24" cy="24" r="8"/>
        <circle cx="33.5" cy="14.5" r="1.6"/>
      </svg>
    </div>
    <div class="label label-latin">Instagram</div>
    <div class="sub">Photo</div>
    <div class="note">&nbsp;</div>
  </div>

</div>
</body>
</html>
