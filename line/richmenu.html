    width: 2500px;
    height: 1686px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 4px;
    background: var(--sand);
  }

  .cell {
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    position: relative;
  }

  /* 主導線（予約）のみ塗りで強調する */
  .cell.primary { background: var(--clay); }

  .icon { width: 150px; height: 150px; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .icon svg * { stroke: var(--clay); }
  .primary .icon svg * { stroke: var(--cream); }

  .label {
    font-family: 'Noto Serif JP', 'IPAPGothic', serif;
    font-weight: 600;
    font-size: 82px;
    letter-spacing: 0.08em;
    color: var(--bark);
    line-height: 1.2;
    text-align: center;
  }
  .primary .label { color: var(--warm-white); }

  .sub {
    font-family: 'Cormorant Garamond', 'Liberation Serif', serif;
    font-size: 40px;
    font-style: italic;
    letter-spacing: 0.28em;
    color: var(--taupe);
    text-transform: uppercase;
  }
  .primary .sub { color: var(--sand); }

  /* ラテン文字のみのラベルは字幅が広いので少し詰める */
  .label-latin { font-size: 72px; letter-spacing: 0.02em; }

  .note {
    font-size: 32px;
    letter-spacing: 0.1em;
    color: var(--text-mid);
    text-align: center;
    line-height: 1.5;
    /* 6マスすべてで4行構成にし、セル間の縦位置を揃えるための最低高 */
    min-height: 48px;
  }
  .primary .note { color: var(--sand); }

  /* 予約セルの「24時間受付」バッジ */
  .badge {
    display: inline-block;
    border: 2px solid var(--sand);
    border-radius: 999px;
    padding: 12px 32px;
    font-size: 32px;
    letter-spacing: 0.14em;
    color: var(--sand);
  }
</style>
</head>
